name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'shared/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'build.gradle.kts'
            ios:
              - 'iosApp/**'

  android:
    name: Android Tests & Code Analysis
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Tests & Detekt
        run: ./gradlew :shared:testAndroidHostTest :server:test detekt --parallel

      - name: Verify Screenshot Tests
        # UTC or the rendered timestamps carry the runner's offset and nothing matches.
        env:
          TZ: UTC
        run: ./gradlew :androidApp:verifyRoborazziDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: shared/build/reports/tests/

      - name: Upload Detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          # Per subproject since detekt moved off the root project, which owns no Kotlin compilation.
          path: '**/build/reports/detekt/'

  ios:
    name: iOS
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event.pull_request.draft == false &&
      (needs.changes.outputs.shared == 'true' || needs.changes.outputs.ios == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Swift formatting
        run: ./scripts/lint-swift.sh

      # TODO: Enable actual tests when ready for CI enforcement (needs macos-latest for a simulator)

