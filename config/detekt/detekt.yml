# Only what we decide differently from detekt's shipped defaults — `buildUponDefaultConfig = true` supplies
# the rest, so an upgrade brings detekt's new rules instead of freezing this file's copy of the old ones.

config:
  # The anchor below is ours, not a ruleset — validation has to be told to skip it.
  excludes: ['_test-sources']

# detekt's own list misses androidHostTest, the KMP Android unit-test source set.
_test-sources: &test-sources
  - '**/test/**'
  - '**/androidTest/**'
  - '**/androidHostTest/**'
  - '**/androidUnitTest/**'
  - '**/androidInstrumentedTest/**'
  - '**/commonTest/**'
  - '**/jvmTest/**'
  - '**/jsTest/**'
  - '**/iosTest/**'

complexity:
  CognitiveComplexMethod:
    active: true
  # A Composable's branching is layout, not logic — it reads as one screen however many `if`s it holds.
  # An exhaustive enum-to-enum `when` is a table, not a decision — it counts one branch per entry otherwise.
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
    ignoreSimpleWhenEntries: true
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreDefaultParameters: true
  TooManyFunctions:
    excludes: *test-sources
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 15
    allowedFunctionsPerInterface: 10
    allowedFunctionsPerObject: 15
    allowedFunctionsPerEnum: 10
    ignoreDeprecated: true
    ignorePrivate: true

coroutines:
  GlobalCoroutineUsage:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

exceptions:
  ThrowingExceptionsWithoutMessageOrCause:
    excludes: *test-sources
  TooGenericExceptionCaught:
    excludes: *test-sources

naming:
  BooleanPropertyNaming:
    active: true
    allowedPattern: '^(is|has|are|should|can|was)'
  FunctionNaming:
    excludes: *test-sources
    ignoreAnnotated: ['Composable']
  LambdaParameterNaming:
    active: true
  NonBooleanPropertyPrefixedWithIs:
    active: true

performance:
  # The compiler already avoids the array copy in the constructor case this reports.
  SpreadOperator:
    active: false

potential-bugs:
  DontDowncastCollectionTypes:
    active: true
  MissingPackageDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true

style:
  CollapsibleIfStatements:
    active: true
  ExplicitItLambdaParameter:
    active: false
  ForbiddenComment:
    active: false
  MagicNumber:
    excludes: *test-sources
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
    ignoreRanges: true
    ignoreAnnotated: ['Composable']
  # Pinned rather than inherited: 120 is a studio decision recorded in naming.md, not detekt's to move.
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  NoTabs:
    active: true
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  SerialVersionUIDInSerializableClass:
    active: false
  SpacingAfterPackageAndImports:
    active: true
  TrailingWhitespace:
    active: true
  UnnecessaryBackticks:
    active: true
  UnnecessaryLet:
    active: true
  UnusedImport:
    active: true
  # A @Preview is invoked by the tooling, never by us.
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  UseEmptyCounterpart:
    active: true
  UseIfEmptyOrIfBlank:
    active: true

Compose:
  ModifierMissing:
    active: false
