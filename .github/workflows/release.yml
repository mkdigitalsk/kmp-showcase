# Milestone release — tag v0.x.0 (or v1.x.0 after handover) builds the signed client build.
#
# The version scheme: milestone = minor bump (0.1.0, 0.2.0 … while building; 1.0.0 = handover;
# 1.x.0 after). The tag IS the versionName, so the Jira release, the FR/TR Release property, the
# build the client receives and a bug report's Environment row all carry one code.
#
# The gate (ci.yml) runs on push; this workflow only ships what main already gated. It builds,
# it does not test — a tag on an ungated commit is the operator's mistake, not a path to support.
#
# Android secrets (repo → Settings → Secrets and variables → Actions):
#   ANDROID_RELEASE_KEYSTORE_BASE64   base64 of androidApp/release.keystore
#   ANDROID_STORE_PASSWORD            keystore store password
#   ANDROID_KEY_ALIAS                 key alias
#   ANDROID_KEY_PASSWORD              key password
#   FIREBASE_SERVICE_ACCOUNT_JSON     a service account with the App Distribution Admin role
# Distribution goes to the Firebase tester group from fb.test.group; with no local.properties in CI
# the Gradle fallback group "testers" applies — put the engagement's group name there.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    name: Android → Firebase App Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the release secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ] && missing="$missing ANDROID_RELEASE_KEYSTORE_BASE64"
          [ -z "$CREDENTIALS" ] && missing="$missing FIREBASE_SERVICE_ACCOUNT_JSON"
          if [ -n "$missing" ]; then
            echo "::error::release secrets not set:$missing — see the header of this workflow"
            exit 1
          fi

      # v0.2.0 → versionName 0.2.0, versionCode 200 (major*10000 + minor*100 + patch).
      # Deterministic — re-running the tag rebuilds the same code — and monotonic while
      # versions ascend. Caps: minor and patch < 100.
      - name: Version from the tag
        id: version
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_OUTPUT"

      - name: Signing material
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > androidApp/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > androidApp/keystore.properties

      - name: Firebase credentials
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/firebase.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase.json" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and distribute
        run: >
          ./gradlew :androidApp:assembleRelease :androidApp:appDistributionUploadRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Keep the shipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-${{ steps.version.outputs.name }}
          path: androidApp/build/outputs/apk/release/*.apk

  # ── iOS → TestFlight — scaffold, inert until the Apple Developer licence exists ──────────────
  #
  # Enable by setting the repository variable IOS_RELEASE_ENABLED=true once every TODO below is real.
  # Finish-later checklist (in the order they can be obtained):
  #   1. Apple Developer Program membership (licence — not bought yet, deliberate)
  #   2. App Store Connect: create the app → note the bundle id it registers
  #   3. ASC API key (Users and Access → Integrations): secrets ASC_API_KEY_ID,
  #      ASC_API_ISSUER_ID, ASC_API_KEY_P8 (the .p8 contents)
  #   4. Distribution signing: certificate + provisioning profile (or fastlane match),
  #      and an ExportOptions.plist beside iosApp/ for method app-store
  #   5. Xcode on the runner builds iosApp/iosApp.xcodeproj — verify the scheme name (iosApp)
  ios:
    name: iOS → TestFlight (disabled until licenced)
    if: ${{ vars.IOS_RELEASE_ENABLED == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Archive
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
          -configuration Release -archivePath "$RUNNER_TEMP/iosApp.xcarchive"
          archive
          MARKETING_VERSION=${{ steps.version.outputs.name }}

      - name: Export and upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_API_KEY_ID.p8
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            -allowProvisioningUpdates
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa --type ios \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
